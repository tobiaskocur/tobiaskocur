  <style>
    .c { fill: #1f2328; font: 18px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; animation: show 0.01s step-end both; }
    .caret { fill: #1f2328; animation: move 3.18s steps(53, start) 0.4s both; }
    .blink { animation: blink 1s step-end infinite; }
    @media (prefers-color-scheme: dark) { .c, .caret { fill: #e6edf3; } }
    @keyframes show { from { opacity: 0; } to { opacity: 1; } }
    @keyframes move { from { transform: translateX(0); } to { transform: translateX(572.4px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .c, .blink { animation: none; }
      .caret { animation: none; transform: translateX(572.4px); }
    }
  </style>
